name: Android Full Environment Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      ANDROID_HOME: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT
          TOOL_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          curl -fsSL -o commandlinetools.zip $TOOL_URL
          unzip -q commandlinetools.zip -d cmdline-tools-tmp
          mkdir -p cmdline-tools/latest
          mv cmdline-tools-tmp/cmdline-tools/* cmdline-tools/latest/
          rm -rf commandlinetools.zip cmdline-tools-tmp
          chmod -R a+rX $ANDROID_SDK_ROOT

      - name: Install SDK platforms, build-tools, NDK and tools (with retries)
        run: |
          set -euo pipefail
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          sdkmanager --version || true
          for i in 1 2 3; do
            yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-36" "platforms;android-33" "build-tools;36.0.0" "build-tools;33.0.2" "cmake;3.22.1" "ndk;21.4.7075529" && break || sleep 10
          done
          yes | sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT || true

      - name: Show Java, SDK & Gradle info
        run: |
          set -euo pipefail
          java -version || true
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_SDK_ROOT || true
          echo "--- Gradle Wrapper ---"
          cat gradle/wrapper/gradle-wrapper.properties || true
          ./gradlew --version || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean and save output
        run: |
          set -euo pipefail
          ./gradlew clean --warning-mode=all --stacktrace > build.log 2>&1 || true

      - name: Assemble Debug APK
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --warning-mode=all --info --stacktrace >> build.log 2>&1 || true

      - name: Assemble Release APK
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --warning-mode=all --info --stacktrace >> build.log 2>&1 || true

      - name: List APKs
        run: |
          ls -R app/build/outputs/apk || true

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
