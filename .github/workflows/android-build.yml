name: Android Full Environment Build

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      ANDROID_HOME: ${{ runner.temp }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Temurin JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Temurin JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure JAVA_HOME set to JDK 11 (preferred)
        run: |
          echo "Using Java"; java -version || true
          echo "Setting JAVA_HOME to Java 11 from toolcache"
          if [ -d "/opt/hostedtoolcache/Temurin_11" ]; then
            export JAVA_HOME=$(ls -d /opt/hostedtoolcache/Temurin_11* | sort -V | tail -n1)
          fi
          echo "JAVA_HOME=$JAVA_HOME"
          echo "::set-env name=JAVA_HOME::$JAVA_HOME" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android command-line tools
        run: |
          set -e
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT
          TOOL_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          curl -sSLo commandlinetools.zip $TOOL_URL
          unzip -q commandlinetools.zip -d cmdline-tools-tmp
          mkdir -p cmdline-tools/latest
          mv cmdline-tools-tmp/cmdline-tools/* cmdline-tools/latest/
          rm -rf commandlinetools.zip cmdline-tools-tmp

      - name: Install SDK platforms, build-tools, NDK and tools
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-36" "platforms;android-33" "build-tools;36.0.0" "build-tools;33.0.2" "cmake;3.22.1" "ndk;21.4.7075529" || true
          yes | sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT || true

      - name: Install Gradle 7.4.2 (system fallback)
        run: |
          sudo mkdir -p /opt/gradle
          cd /opt/gradle
          if [ ! -d gradle-7.4.2 ]; then
            sudo curl -sSLo gradle-7.4.2-bin.zip https://services.gradle.org/distributions/gradle-7.4.2-bin.zip
            sudo unzip -q gradle-7.4.2-bin.zip -d /opt/gradle
            sudo rm gradle-7.4.2-bin.zip
          fi
          echo "/opt/gradle/gradle-7.4.2/bin" | sudo tee /etc/profile.d/gradle.sh
          sudo chmod +x /opt/gradle/gradle-7.4.2/bin/gradle || true
          export PATH=/opt/gradle/gradle-7.4.2/bin:$PATH
          gradle --version || true

      - name: Show Java, SDK & Gradle info
        run: |
          java -version || true
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_SDK_ROOT || true
          echo "--- Gradle Wrapper ---"
          cat gradle/wrapper/gradle-wrapper.properties || true
          ./gradlew --version || gradle --version || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Clean (save output)
        run: |
          ./gradlew clean --warning-mode=all --stacktrace > build.log 2>&1 || true

      - name: Assemble Debug APK (first)
        run: |
          ./gradlew assembleDebug --no-daemon --warning-mode=all --info --stacktrace >> build.log 2>&1 || true

      - name: Assemble Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --warning-mode=all --info --stacktrace >> build.log 2>&1 || true

      - name: List APKs
        run: ls -R app/build/outputs/apk || true

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
